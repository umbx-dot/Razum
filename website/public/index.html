<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Razum programming language</title>
    <meta name="description" content="Razum is a small C-like language that compiles to native programs for Windows and Linux. Explore the docs, playground, benchmarks, and interactive course.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#/" data-nav="home" aria-label="Razum home">
            <span class="logo" aria-hidden="true">rz</span>
            <span class="brand-text">Razum</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="#/docs" data-nav="docs">Docs</a>
            <a href="#/playground" data-nav="playground">Playground</a>
            <a href="#/benchmarks" data-nav="benchmarks">Benchmarks</a>
            <a href="#/learn" data-nav="learn">Learn</a>
        </nav>
        <span class="spacer"></span>
        <div class="progress-pill" id="course-progress" title="Lessons done" hidden>
            <div class="bar"><span id="progress-fill"></span></div>
            <span id="progress-text">0 / 0</span>
        </div>
        <button class="icon-button theme" id="theme-toggle" aria-label="Switch theme">◐</button>
    </header>
    <div class="offline-banner" id="offline" hidden>
        The razum server is not running, so code cannot run. Start it with <code>website\razum-learn.exe</code> and reload.
    </div>
    <main id="app" class="view"></main>
    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
